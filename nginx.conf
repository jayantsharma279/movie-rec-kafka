events {
    worker_connections 1024;
}

http {
    # Upstream servers for blue-green deployment
    upstream recommender_backend {
        # Default: route to v1
        # To switch to v2, comment out v1 and uncomment v2
        # server recommender_v1:8082 max_fails=3 fail_timeout=30s;
        server recommender_v2:8082 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for the load balancer itself
        location /lb-health {
            access_log off;
            return 200 "Load balancer is healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy all recommendation requests to backend
        location / {
            proxy_pass http://recommender_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Retry on failure
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Health check proxy (optional - for monitoring)
        location /backend-health {
            proxy_pass http://recommender_backend/health;
            proxy_set_header Host $host;
        }
    }
}
