services:
  recommender_v1:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: recommender_v1
    ports:
      - "8082:8082"  # v1 is reachable directly for testing
    environment:
      - TELEMETRY_DIR=/var/log/recsys
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - ./scripts/models:/app/scripts/models:ro
      - /var/log/recsys:/var/log/recsys 
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  recommender_v2:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: recommender_v2
    ports:
      - "8083:8082"  # map container 8082 -> host 8083
    environment:
      - TELEMETRY_DIR=/var/log/recsys
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - ./scripts/models:/app/scripts/models:ro
      - /var/log/recsys:/var/log/recsys
         
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  monitoring:
    image: busybox
    container_name: recsys_monitor
    command: ["/bin/sh", "-c", "while true; do date; sleep 60; done"]
    restart: unless-stopped

  # Nginx Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: recsys_loadbalancer
    ports:
      - "80:80"  # Main entry point for all traffic
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - recommender_v1
      - recommender_v2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: ./scheduler
    container_name: scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/scripts
      - ./dataset:/app/dataset
      - /var/log/recsys:/app/var/log/recsys
    depends_on:
      - recommender_v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    restart: always

